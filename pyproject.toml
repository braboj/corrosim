[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corrosim"
version = "0.2.0"
description = "Automated screening of green corrosion inhibitors (DFT descriptors, adsorption estimate, reports)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Branimir Georgiev", email = "branimir@imbra.io" }]
keywords = ["corrosion", "inhibitor", "DFT", "xtb", "adsorption", "computational-chemistry"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
]
# Lower bounds are the tested-minimum on Python 3.10; left open above so the
# library composes with whatever recent stack the user already has.
dependencies = [
    "numpy>=1.24",
    "rdkit>=2022.9",
    "ase>=3.22",
    "pandas>=1.5",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
# Quantum engines (xTB is cheap; PySCF is the open DFT path).
# geometric = geomeTRIC backend for PySCF DFT geometry optimisation.
qm = ["tblite", "pyscf", "geometric"]

# Figure/cube rendering: orbital + ESP isosurfaces (marching cubes + grid sampling).
viz = ["scikit-image", "scipy", "Pillow"]

# Word (.docx) report output (make_report). Pure-Python, no system binary; the
# HTML report needs none of this.

report = ["python-docx>=1.0"]
# Tests / dev (viz + report deps listed explicitly so the renderers are importable).
# tblite is deliberately NOT here: the suite is QM-light (CLAUDE.md 3.1), and the
# one xtb smoke test importorskips it. Use `.[dev,qm]` to exercise the xtb path.

dev = ["pytest", "pytest-cov", "ruff", "mypy", "complexipy", "scikit-image",
       "scipy", "Pillow", "python-docx>=1.0"]

[project.scripts]
corrosim = "corrosim.cli:main"
# One command for the full multiscale study: orchestrates the runs/* drivers in
# dependency order (also runnable as `python -m corrosim.runs.run_study`).
corrosim-run-study = "corrosim.runs.run_study:main"
# Dev-time library-expand tool. Uses only the stdlib (urllib) to query PubChem,
# so it needs no extra dependency; runs and CI stay offline by default.
corrosim-add-inhibitor = "corrosim.fetch:main"

[project.urls]
Homepage = "https://github.com/braboj/corrosim"
Repository = "https://github.com/braboj/corrosim"
Issues = "https://github.com/braboj/corrosim/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["corrosim*"]

[tool.setuptools.package-data]
# Ship the inhibitor library and the case-agnostic pipeline diagram as package
# data (both loaded via importlib.resources), so adding a molecule is a data
# edit and the report's Overview figure (fig0) travels in the wheel/sdist.
corrosim = ["data/*.json", "report/assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["corrosim"]
# Coverage is scoped to the QM-light-testable surface (issue #31 / ADR 0007).
# These modules need a QM engine (PySCF/tblite) or Docker to execute, so they
# cannot run in the venv/CI suite; they are validated by the QM suite
# (`docker compose run --rm qm pytest`) and the tracked pipeline artifacts, and
# are excluded from the coverage denominator rather than left as dead weight.
omit = [
    "src/corrosim/qm/engines.py",
    "src/corrosim/qm/fukui.py",
    "src/corrosim/runs/run_dft.py",
    "src/corrosim/runs/run_fukui.py",
    "src/corrosim/runs/run_pka.py",
    "src/corrosim/runs/make_cubes.py",
]

[tool.coverage.report]
# Gate the scoped (non-omitted) surface at 80% — the python-lib stack target,
# now meaningful because the untestable QM layer is out of the denominator.
fail_under = 80
show_missing = true

[tool.mypy]
# Non-strict introduction (issue #6): catch real type errors without forcing
# annotations everywhere yet. Trigger to tighten — once the public API is fully
# annotated and stubs exist for the scientific deps, flip on disallow_untyped_defs
# + strict_optional per module, then drop ignore_missing_imports en route to --strict.
files = ["src"]
python_version = "3.10"
ignore_missing_imports = true        # rdkit/ase/pyscf/tblite/skimage ship no usable stubs
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Treat the scientific stack as untyped (Any): their stubs/sources use PEP 695
# `type` aliases (3.12+) or, for rdkit, contain a syntax error mypy can't parse at
# our 3.10 target. Skipping the top-level libs stops mypy descending into their
# 3.12-syntax transitive deps (e.g. skimage -> tifffile).
module = [
    "rdkit.*", "numpy", "numpy.*", "pandas", "pandas.*", "scipy.*", "skimage.*",
    "matplotlib.*", "mpl_toolkits.*", "ase.*", "PIL.*", "tblite.*", "pyscf.*",
]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.ruff]
# 80-col readability standard (ADR 0012 / issue #52).
line-length = 80
target-version = "py310"
extend-exclude = ["docs/solid-ai-templates"]

[tool.ruff.lint]
# pyflakes + pycodestyle + imports + Google docstrings (D, incl. D417) +
# mccabe cyclomatic complexity (C90). The full public API contract (ADR 0012 /
# issue #51) — all public params/returns typed — is enforced by
# tests/test_docstrings.py, not ruff `ANN`, so private QM helpers that take
# un-stubbed pyscf objects stay annotation-free.
select = ["E", "F", "I", "W", "D", "C90"]
extend-select = ["D417"]

# corrosim keeps a deliberately compact scientific style; accept it:
#   E741 single-letter math names (l, O, N); E702 `a; b` step chains;
#   E731 `log = lambda ...` driver shorthands; E401 grouped stdlib imports.
#   D205 blank-line-after-summary: corrosim docstrings lead with a long,
#     formula-bearing sentence that spans lines, so the one-line-summary rule
#     doesn't fit; the rest of the Google convention is enforced.
ignore = ["E741", "E702", "E731", "E401", "D205"]

[tool.ruff.lint.mccabe]
# Cyclomatic-complexity gate (ADR 0012). 15 = the quality.md target; the one
# linear section-by-section report builder above it carries a documented
# `# noqa: C901`.
max-complexity = 15

[tool.ruff.lint.pydocstyle]
# Public-symbol docstrings follow the Google convention (python-lib stack, #31).
# The "docstrings exist" + full Args/Returns contract is additionally pinned by
# tests/test_docstrings.py (issues #6, #51); the D rules add format enforcement.
convention = "google"

[tool.ruff.lint.per-file-ignores]
# report.py and gallery.py embed long single-line CSS rules and HTML content
# inside string literals (including an unbreakable web-font URL).
"src/corrosim/report/report.py" = ["E501"]
"src/corrosim/report/gallery.py" = ["E501"]
# Tests are not public API — docstrings (D), line length and complexity there
# are not held to the package standard.
"tests/**" = ["D", "E501", "C901"]

[tool.complexipy]
# Cognitive-complexity ratchet (SonarQube's metric — counts nesting and
# control-flow interruptions, which McCabe/C901 cannot see). Threshold matches
# the C901 gate. complexipy-snapshot.json is the committed watermark: an
# over-threshold function fails only when it is NEW or has INCREASED relative
# to the snapshot, so pre-existing offenders are frozen, not exempted. A
# successful run rewrites the snapshot; commit the refresh in the same change.
paths = ["src/corrosim"]
max-complexity-allowed = 15

[tool.bandit]
# Security SAST (issue #31 / ADR 0007). The runtime security surface is the two
# local QM-binary subprocess launches in engines.py, reviewed and marked
# `# nosec` at the call site (fixed argv, no shell, no untrusted input). Tests
# and vendored docs carry no runtime surface. The report-bundle exclude is
# anchored (./report) so it cannot swallow the src/corrosim/report sub-package.
exclude_dirs = ["tests", "docs", "cubes", "results", "./report"]
